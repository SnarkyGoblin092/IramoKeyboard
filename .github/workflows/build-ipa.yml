name: Build Iramo IPA

# Runs on every push (except documentation-only changes) and can also be started by hand
# (Actions tab > Build Iramo IPA > Run workflow).
on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

jobs:
  # The dictionaries and emoji data are plain Python work, so they are built on Linux, whose minutes cost a tenth
  # of macOS minutes in private repos. They only change when the scripts do (or the sources update), so they are
  # cached for a week and shared with the macOS job instead of downloading ~400 MB of word lists on every push.
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      key: ${{ steps.key.outputs.key }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache key (the scripts, refreshed weekly)
        id: key
        run: echo "key=data-${{ hashFiles('scripts/build_data.py', 'scripts/language_model.py', 'scripts/lexicon.py', 'scripts/predict_eval/keyboard.py') }}-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore generated data
        id: data-cache
        uses: actions/cache@v4
        with:
          path: Keyboard/Resources
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true

      - name: Download words, emoji and keywords
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: python3 scripts/build_data.py

      - name: Check generated data
        run: |
          ls -la Keyboard/Resources
          test -s Keyboard/Resources/emoji.json
          for f in en hu; do test -s Keyboard/Resources/dict_$f.bin; done
          for f in Keyboard/Resources/dict_*.bin; do
            test -s "$f" || { echo "::error::$f is empty"; exit 1; }
          done
          ls Keyboard/Resources/dict_*.bin | wc -l
          for f in Keyboard/Resources/pairs_*.tsv; do
            test -s "$f" || echo "::warning::$f is empty; next-word suggestions for it only come from typing"
          done
          for f in Keyboard/Resources/dict_*.bin; do
            lm="${f/dict_/lm_}"
            test -s "$lm" || echo "::warning::$lm is missing; that language has no language model"
          done
          du -ch Keyboard/Resources/lm_*.bin | tail -1
          du -ch Keyboard/Resources/dict_*.bin | tail -1
          python3 - <<'PY'
          import glob, json
          data = json.load(open("Keyboard/Resources/emoji.json"))
          total = sum(len(g["items"]) for g in data["groups"])
          print("Unicode emoji", data["version"], "->", total, "emoji")
          assert total > 1500, "emoji list looks too small"
          for path in sorted(glob.glob("Keyboard/Resources/emoji_search_*.json")):
              n = len(json.load(open(path)))
              print(path, "searchable emoji:", n)
              if n < 800:
                  print(f"::warning::{path} looks thin; emoji search will be weak")
          PY

  build:
    needs: data
    # macOS 26 runners carry Xcode 26+, which has the Liquid Glass APIs (UIGlassEffect). They run on Apple
    # silicon, which builds far faster than the Intel runners; if jobs sit queued, use macos-15-intel.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Restore generated data (built by the data job)
        uses: actions/cache/restore@v4
        with:
          path: Keyboard/Resources
          key: ${{ needs.data.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Select newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen and ldid
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project HunKeys.xcodeproj \
            -scheme HunKeys \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      # One IPA. The App Group entitlement is written into the signature of BOTH the app and the keyboard
      # (ldid), so iloader / AltStore / SideStore can keep it when they re-sign, and the app's settings
      # reach the keyboard.
      - name: Package IPA
        run: |
          command -v ldid
          rm -rf Payload Iramo.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/HunKeys.app Payload/
          APP=Payload/HunKeys.app
          ldid -SConfig/AppGroup.entitlements "$APP/PlugIns/HunKeysKeyboard.appex/HunKeysKeyboard"
          ldid -SConfig/AppGroup.entitlements "$APP/HunKeys"
          ldid -e "$APP/PlugIns/HunKeysKeyboard.appex/HunKeysKeyboard" | tee appex-ent.txt
          ldid -e "$APP/HunKeys" | tee app-ent.txt
          grep -q "group.com.hunkeys.k9x4.shared" appex-ent.txt
          grep -q "group.com.hunkeys.k9x4.shared" app-ent.txt
          zip -qry Iramo.ipa Payload
          ls -la Iramo.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          # Not zipped: the download is Iramo.ipa itself (the file name is the artifact name).
          archive: false
          path: Iramo.ipa
          if-no-files-found: error

      - name: Show compiler errors (only if something failed)
        if: failure()
        run: |
          echo "---- errors ----"
          grep -E "error:" build.log | sort -u | head -60 || true

      - name: Upload build log (only if something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
