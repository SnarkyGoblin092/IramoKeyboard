name: Build HunKeys IPA

# Runs on every push and can also be started by hand (Actions tab > Build HunKeys IPA > Run workflow).
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Download words, emoji and keywords
        run: python3 scripts/build_data.py

      - name: Check generated data
        run: |
          ls -la Keyboard/Resources
          test -s Keyboard/Resources/emoji.json
          test -s Keyboard/Resources/words_en.tsv
          test -s Keyboard/Resources/words_hu.tsv
          python3 - <<'PY'
          import json
          data = json.load(open("Keyboard/Resources/emoji.json"))
          total = sum(len(g["items"]) for g in data["groups"])
          print("Unicode emoji", data["version"], "->", total, "emoji")
          assert total > 1500, "emoji list looks too small"
          for lang in ("en", "hu"):
              n = len(json.load(open(f"Keyboard/Resources/emoji_keywords_{lang}.json")))
              print(lang, "emoji keywords:", n)
              if n < 300:
                  print(f"::warning::only {n} emoji keywords for {lang}; emoji suggestions will be weak")
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project HunKeys.xcodeproj \
            -scheme HunKeys \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          rm -rf Payload HunKeys.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/HunKeys.app Payload/
          zip -qry HunKeys.ipa Payload
          echo "IPA contents (top level):"
          unzip -l HunKeys.ipa | grep -E "Info.plist|PlugIns|\.appex" | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HunKeys-unsigned-ipa
          path: HunKeys.ipa
          if-no-files-found: error

      - name: Show compiler errors (only if something failed)
        if: failure()
        run: |
          echo "---- errors ----"
          grep -E "error:" build.log | sort -u | head -60 || true

      - name: Upload build log (only if something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
