name: Build HunKeys IPA

# Runs on every push and can also be started by hand (Actions tab > Build HunKeys IPA > Run workflow).
on:
  push:
  workflow_dispatch:

jobs:
  build:
    # macOS 26 runners carry Xcode 26+, which has the Liquid Glass APIs (UIGlassEffect).
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Download words, emoji and keywords
        run: python3 scripts/build_data.py

      - name: Check generated data
        run: |
          ls -la Keyboard/Resources
          test -s Keyboard/Resources/emoji.json
          for f in en hu; do test -s Keyboard/Resources/words_$f.tsv; done
          for f in Keyboard/Resources/words_*.tsv; do
            test -s "$f" || { echo "::error::$f is empty"; exit 1; }
          done
          ls Keyboard/Resources/words_*.tsv | wc -l
          python3 - <<'PY'
          import glob, json
          data = json.load(open("Keyboard/Resources/emoji.json"))
          total = sum(len(g["items"]) for g in data["groups"])
          print("Unicode emoji", data["version"], "->", total, "emoji")
          assert total > 1500, "emoji list looks too small"
          for path in sorted(glob.glob("Keyboard/Resources/emoji_search_*.json")):
              n = len(json.load(open(path)))
              print(path, "searchable emoji:", n)
              if n < 800:
                  print(f"::warning::{path} looks thin; emoji search will be weak")
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project HunKeys.xcodeproj \
            -scheme HunKeys \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      # One IPA. The App Group entitlement is written into the signature of BOTH the app and the keyboard
      # (ldid), so iloader / AltStore / SideStore can keep it when they re-sign, and the app's settings
      # reach the keyboard.
      - name: Package IPA
        run: |
          brew install ldid
          command -v ldid
          rm -rf Payload HunKeys.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/HunKeys.app Payload/
          APP=Payload/HunKeys.app
          ldid -SConfig/AppGroup.entitlements "$APP/PlugIns/HunKeysKeyboard.appex/HunKeysKeyboard"
          ldid -SConfig/AppGroup.entitlements "$APP/HunKeys"
          ldid -e "$APP/PlugIns/HunKeysKeyboard.appex/HunKeysKeyboard" | tee appex-ent.txt
          ldid -e "$APP/HunKeys" | tee app-ent.txt
          grep -q "group.com.hunkeys.k9x4.shared" appex-ent.txt
          grep -q "group.com.hunkeys.k9x4.shared" app-ent.txt
          zip -qry HunKeys.ipa Payload
          ls -la HunKeys.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HunKeys-ipa
          path: HunKeys.ipa
          if-no-files-found: error

      - name: Show compiler errors (only if something failed)
        if: failure()
        run: |
          echo "---- errors ----"
          grep -E "error:" build.log | sort -u | head -60 || true

      - name: Upload build log (only if something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
