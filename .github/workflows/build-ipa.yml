name: Build Iramo IPA

# Runs only when started by hand (Actions tab > Build Iramo IPA > Run workflow).
on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Download the word lists and emoji data again (otherwise the cached copy is used)"
        type: boolean
        default: false

jobs:
  # The dictionaries and emoji data are plain Python work, so they are built on Linux, whose minutes cost a tenth
  # of macOS minutes in private repos. They only change when the scripts do (or the sources update), so they are
  # cached and shared with the macOS job instead of downloading ~400 MB of word lists on every build. The cache is
  # kept until a script changes or "Refresh data" is ticked when starting the workflow (it no longer expires weekly,
  # which made the first build of every week download and compress everything again).
  # They are compressed here too, once, rather than in every macOS build.
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # 33 word lists, each with its language model
    outputs:
      key: ${{ steps.key.outputs.packed }}

    steps:
      - uses: actions/checkout@v4

      # Two caches: the data as the scripts write it, and the same data compressed as it ships (what the macOS job
      # needs). A build that changes neither only looks the second one up, in seconds; "xz1" names how the files are
      # packed, so change it when the "Compress language data" step changes.
      - name: Cache keys (the scripts, or a refresh)
        id: key
        run: |
          fresh="${{ inputs.refresh_data && github.run_id || 'kept' }}"
          raw="data-${{ hashFiles('scripts/build_data.py', 'scripts/language_model.py', 'scripts/lexicon.py', 'scripts/predict_eval/keyboard.py') }}-$fresh"
          echo "raw=$raw" >> "$GITHUB_OUTPUT"
          echo "packed=$raw-xz1" >> "$GITHUB_OUTPUT"

      # Only looks the compressed copy up (nothing is downloaded here; the macOS job restores it itself).
      - name: Look for compressed data
        id: packed
        uses: actions/cache/restore@v4
        with:
          path: Keyboard/Resources
          key: ${{ steps.key.outputs.packed }}
          enableCrossOsArchive: true
          lookup-only: true

      - name: Restore generated data
        id: raw
        if: steps.packed.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: Keyboard/Resources
          key: ${{ steps.key.outputs.raw }}
          enableCrossOsArchive: true

      - name: Download words, emoji and keywords
        if: steps.packed.outputs.cache-hit != 'true' && steps.raw.outputs.cache-hit != 'true'
        run: python3 scripts/build_data.py

      - name: Save generated data
        if: steps.packed.outputs.cache-hit != 'true' && steps.raw.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Keyboard/Resources
          key: ${{ steps.key.outputs.raw }}
          enableCrossOsArchive: true

      - name: Check generated data
        if: steps.packed.outputs.cache-hit != 'true'
        run: |
          ls -la Keyboard/Resources
          for f in en hu; do test -s Keyboard/Resources/dict_$f.bin; done
          for f in Keyboard/Resources/dict_*.bin; do
            test -s "$f" || { echo "::error::$f is empty"; exit 1; }
          done
          ls Keyboard/Resources/dict_*.bin | wc -l
          for f in Keyboard/Resources/pairs_*.tsv; do
            test -s "$f" || echo "::warning::$f is empty; next-word suggestions for it only come from typing"
          done
          for f in Keyboard/Resources/dict_*.bin; do
            lm="${f/dict_/lm_}"
            test -s "$lm" || echo "::warning::$lm is missing; that language has no language model"
          done
          du -ch Keyboard/Resources/lm_*.bin | tail -1
          for f in Keyboard/Resources/phonetic_*.tsv; do
            test -s "$f" || echo "::warning::$f is empty; that Chinese can only type letters"
          done
          wc -l Keyboard/Resources/phonetic_*.tsv || true
          du -ch Keyboard/Resources/dict_*.bin | tail -1

      # words_<lang>.tsv is only read when dict_<lang>.bin is missing (WordStore.parse), so a language that has
      # its dictionary ships without the word list. The sizes show what the language data takes up.
      - name: Drop word lists the dictionaries replace
        if: steps.packed.outputs.cache-hit != 'true'
        run: |
          du -sh Keyboard/Resources
          for f in Keyboard/Resources/words_*.tsv; do
            dict="${f/words_/dict_}"
            if [ -s "${dict%.tsv}.bin" ]; then rm "$f"; fi
          done
          for kind in dict lm words pairs accents phonetic; do
            echo "$kind: $(cat Keyboard/Resources/${kind}_* Keyboard/Resources/${kind}.* 2>/dev/null | wc -c | awk '{printf "%.1f MB", $1 / 1e6}')"
          done
          du -sh Keyboard/Resources

      # Every language file ships compressed as an xz stream (LZMA2, which Apple's Compression framework reads
      # as .lzma; about 28% smaller than DEFLATE on this data); LanguageData unpacks a language's files only once
      # that language is enabled. The 1 MB dictionary costs under 1% of the size and keeps the memory the keyboard
      # needs to unpack a file small.
      - name: Compress language data
        if: steps.packed.outputs.cache-hit != 'true'
        run: |
          python3 - <<'PY'
          import concurrent.futures, lzma, os, pathlib

          def pack(path):
              filters = [{"id": lzma.FILTER_LZMA2, "preset": 6, "dict_size": 1 << 20}]
              packed = lzma.compress(path.read_bytes(), format=lzma.FORMAT_XZ, check=lzma.CHECK_CRC32, filters=filters)
              path.with_name(path.name + ".lzma").write_bytes(packed)
              path.unlink()

          files = [path for path in sorted(pathlib.Path("Keyboard/Resources").iterdir())
                   if path.is_file() and path.name != ".gitkeep" and path.suffix != ".lzma"]
          # Threads, one file per core: lzma compresses outside Python's lock, and worker processes cannot
          # be started from a script read from standard input (they import the main script by its path).
          with concurrent.futures.ThreadPoolExecutor(os.cpu_count() or 2) as pool:
              list(pool.map(pack, files))
          PY
          du -sh Keyboard/Resources

      - name: Save compressed data
        if: steps.packed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Keyboard/Resources
          key: ${{ steps.key.outputs.packed }}
          enableCrossOsArchive: true

  build:
    needs: data
    # macOS 26 runners carry Xcode 26+, which has the Liquid Glass APIs (UIGlassEffect). They run on Apple
    # silicon, which builds far faster than the Intel runners; if jobs sit queued, use macos-15-intel.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Restore compressed data (built by the data job)
        uses: actions/cache/restore@v4
        with:
          path: Keyboard/Resources
          key: ${{ needs.data.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Select newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}-xcodegen-ldid-v1

      - name: Install XcodeGen and ldid (those the runner lacks)
        run: |
          for tool in xcodegen ldid; do
            command -v "$tool" >/dev/null || brew install "$tool"
          done

      - name: Generate Xcode project
        run: xcodegen generate

      # No dSYM (it is not part of the IPA) and no index. The timing summary at the end of the log and the
      # compiler's warnings about code that is slow to type-check are shown by the "Build timing" step.
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project HunKeys.xcodeproj \
            -scheme HunKeys \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -warn-long-expression-type-checking=200 -Xfrontend -warn-long-function-bodies=300' \
            build 2>&1 | tee build.log

      # Where the build's minutes go: Xcode's own summary by kind of work, and the expressions and functions the
      # Swift compiler needed longest to type-check (each of those is a place to make the build faster).
      - name: Build timing
        if: always()
        run: |
          sed -n '/Build Timing Summary/,$p' build.log | head -40 || true
          echo "---- slowest to type-check (ms) ----"
          grep -E "took [0-9]+ms to type-check" build.log \
            | awk '{ if (match($0, /took [0-9]+ms/)) print substr($0, RSTART + 5, RLENGTH - 7), $0 }' \
            | sort -rn | awk '!seen[$0]++' | head -40 || true

      # One IPA. The App Group entitlement is written into the signature of BOTH the app and the keyboard
      # (ldid), so iloader / AltStore / SideStore can keep it when they re-sign, and the app's settings
      # reach the keyboard.
      - name: Package IPA
        run: |
          command -v ldid
          rm -rf Payload Iramo.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/HunKeys.app Payload/
          APP=Payload/HunKeys.app
          ldid -SConfig/AppGroup.entitlements "$APP/PlugIns/HunKeysKeyboard.appex/HunKeysKeyboard"
          ldid -SConfig/AppGroup.entitlements "$APP/HunKeys"
          ldid -e "$APP/PlugIns/HunKeysKeyboard.appex/HunKeysKeyboard" | tee appex-ent.txt
          ldid -e "$APP/HunKeys" | tee app-ent.txt
          grep -q "group.com.hunkeys.k9x4.shared" appex-ent.txt
          grep -q "group.com.hunkeys.k9x4.shared" app-ent.txt
          zip -qry Iramo.ipa Payload
          ls -la Iramo.ipa
          du -sh "$APP" "$APP/PlugIns/HunKeysKeyboard.appex"

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          # Not zipped: the download is Iramo.ipa itself (the file name is the artifact name).
          archive: false
          path: Iramo.ipa
          if-no-files-found: error

      - name: Show compiler errors (only if something failed)
        if: failure()
        run: |
          echo "---- errors ----"
          grep -E "error:" build.log | sort -u | head -60 || true

      - name: Upload build log (only if something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
